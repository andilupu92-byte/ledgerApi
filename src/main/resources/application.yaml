spring:
  application:
    name: ledgerApi
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ledger}
    username: ${SPRING_DATASOURCE_USERNAME:ledger}
    password: ${SPRING_DATASOURCE_PASSWORD:ledger}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    listener:
      simple:
        default-requeue-rejected: false
  flyway:
    enabled: true

server:
  port: 8080

logging:
  pattern:
    level: "%5p [requestId=%X{requestId} paymentId=%X{paymentId} eventId=%X{eventId}]"

